<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyhetsportalen</title>
</head>
<body>
    <a href="#main-content" class="skip-link">Hoppa till huvudinnehåll</a>

    <header class="site-header">
        <div class="header-container">
            <h1 class="logo">Nyhetsportalen</h1>

        <button id="menu-btn" aria-expanded="false" aria-controls="category-menu">
            Meny
        </button>

        <!--Navigation med kategorier-->
    <nav id="category-menu" hidden>
        <ul>
            <li><button class="cat-btn" data-category="general">Almänna nyheter</button></li>
            <li><button class="cat-btn" data-category="nation">Utrikes</button></li>
            <li><button class="cat-btn" data-category="technology">Teknik</button></li>
            <li><button class="cat-btn" data-category="sports">Sport</button></li>
        </ul>
    </nav>
 </div>

        <!--Sök-->
        <form id="search-form" class="search-form" role="search">
            <label for="site-search" class="visually-hidden">Sök nyheter</label>
            <input type="search"
            id="site-search"
            placeholder="Sök nyheter och artiklar"
            aria-label="Sök på webbplatsen"
            required>
            <button type="submit">Sök</button>
        </form>
    </header>

    <main>
        <section id="news-conatiner" aria-label="Nyhetsartiklar"></section>
    </main>

    <footer class="site-footer">
        <p>&copy;Nyhetsportalen 2026</p>
    </footer>
    
    <script src="script.js"></script>

</body>
</html>
