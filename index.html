<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyhetsportalen</title>
</head>
<body>
    <header>
        <form role="search">
            <label for="site-search" class="visually-hidden">Sök nyheter</label>
            <input type="search"
            id="site-search"
            name="search"
            placeholder="Sök nyheter och artiklar"
            aria-label="Sök på webbplatsen"
            required>
            <button type="submit">Sök</button>
        </form>


    <!--Navigeringsmeny-->
    <nav aria-label="Huvudmeny">
        <button type="button"
        id="menu-btn"
        aria-expanded="false"
        aria-controls="main-menu-list">
        <span class="visually-hidden">Öppna meny</span>
        </button>
    
        <ul id="main-menu-list" hidden>
            <li><a href="#">Nyheter</a></li>
            <li><a href="#">Lokalt</a></li>
            <li><a href="#">Sport</a></li>
            <li><a href="#">Utrikes</a></li>
        </ul>
    </nav>
    </header>
    
</body>
</html>
