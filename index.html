<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyhetsportalen</title>
</head>
<body>
    <header>
        <form role="search">
            <label for="site-search" class="visually-hidden">Sök nyheter</label>
            <input type="search"
            id="site-search"
            name="search"
            placeholder="Sök nyheter och artiklar"
            aria-label="Sök på webbplatsen"
            required>
            <button type="submit">Sök</button>
        </form>
    </header>
    
</body>
</html>
